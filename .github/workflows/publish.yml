name: Validate, package, and release Flutter Power Pack

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-package:
    name: Validate and package VS Code extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install VS Code Extension CLI
        run: npm install --global @vscode/vsce@3

      - name: Install project metadata
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate manifest and Marketplace references
        run: npm run validate:manifest

      - name: Package extension
        run: vsce package --no-dependencies --out "flutter-power-pack-${GITHUB_REF_NAME#v}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-power-pack-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Create GitHub release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
